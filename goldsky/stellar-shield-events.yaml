name: stellar-shield-events
resource_size: s
description: Stellar Shield shielded-pool contract events -> Neon

sources:
  stellar_testnet_events:
    type: dataset
    dataset_name: stellar_testnet.events
    version: 1.2.0
    # Contract redeployed 2026-08-02 (commit 680f846) at ~ledger
    # 3,927,635 (see git history for that estimate's derivation), but
    # total_deposit/total_borrow were confirmed 0 for every asset from
    # then until the first real activity since: a seed-liquidity run
    # at ledger 4,312,987 (RPC-verified via getTransaction on its tx
    # hash). Nothing in between is needed for the rolling 7-8-day
    # market chart this feeds, and backfilling the full gap back to
    # contract creation cost ~1.6h of scan time at the observed
    # ~44 ledgers/sec rate for zero payoff. start_at is set 2,000
    # ledgers (a few minutes) before that first real event instead —
    # cheap safety margin without re-scanning ~385,000 dead ledgers.
    # On a future redeploy, or if older history is ever needed, this
    # can be moved back to ~3,927,635 (or earlier) and re-applied;
    # rows from retired contracts persist in the table and are
    # filtered out by the /api/events contract param regardless.
    start_at: "4310987"
    filter: type = 'contract' AND in_successful_contract_call = true

transforms:
  shield_events:
    type: sql
    primary_key: id
    sql: >
      SELECT
        id, contract_id, topics, data,
        transaction_hash, transaction_index,
        ledger_sequence, ledger_closed_at
      FROM stellar_testnet_events
      WHERE contract_id IN (
        'CCNLBMUTHMO5SXRBJ5DIKZDSS3J3OEW4PB5UFWATEXWLEDBGOBIEAEIZ'
      )

sinks:
  neon:
    type: postgres
    from: shield_events
    table: stellar_shield_events
    schema: public
    secret_name: POSTGRES_SECRET_CMS4PVCAP0
    primary_key: id
